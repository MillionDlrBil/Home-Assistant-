blueprint:
  name: Zone Notification (Claude)
  description: Get notified when specified people enter or leave any of the selected zones. Select multiple phones cleanly and optionally include notification images.
  domain: automation
  author: MillionDlrBil
  source_url: https://github.com/MillionDlrBil/Home-Assistant-/blob/Blueprints/zone_notification_blueprint.yaml
  input:
    persons:
      name: Persons / Device Trackers
      selector:
        entity:
          multiple: true
          domain: [person, device_tracker]
    target_zones:
      name: Zones
      default: []
      selector:
        entity:
          multiple: true
          domain: zone
    notify_devices:
      name: Devices to Notify
      selector:
        device:
          integration: mobile_app
          multiple: true
    event_type:
      name: Trigger Event
      default: both
      selector:
        select:
          options:
            - {label: "Enter Only", value: "enter"}
            - {label: "Leave Only", value: "leave"}
            - {label: "Enter and Leave", value: "both"}
    validation_delay:
      name: Pass-through Delay (Seconds)
      default: 0
      selector:
        number: {min: 0, max: 120, unit_of_measurement: s, mode: slider}
    notification_title:
      name: Notification Title (Optional)
      default: ""
      selector: {text: {}}
    notification_image:
      name: Notification Image URL / Local Path (Optional)
      description: "Paste a web URL or local path (e.g. /local/life360.png placed inside your /config/www/ folder)."
      default: ""
      selector: {text: {}}
    is_critical:
      name: Make it a Critical Alert?
      default: false
      selector: {boolean: {}}

mode: parallel

trigger:
  - platform: state
    entity_id: !input persons

variables:
  chosen_event_type: !input event_type
  custom_title: !input notification_title
  critical_override: !input is_critical
  monitored_zones: !input target_zones
  target_devices: !input notify_devices
  img_url: !input notification_image
  delay_amount: !input validation_delay

  has_trigger: "{{ trigger is defined and trigger.to_state is defined and trigger.from_state is defined }}"
  person: "{{ trigger.to_state.name if has_trigger else 'Test Person' }}"
  trigger_entity: "{{ trigger.entity_id if has_trigger else 'none' }}"
  to_state_val: "{{ trigger.to_state.state if has_trigger else 'home' }}"
  from_state_val: "{{ trigger.from_state.state if has_trigger else 'not_home' }}"

  to_zone_entity: >-
    {%- if to_state_val == 'home' -%}
      zone.home
    {%- elif to_state_val == 'not_home' -%}
      none
    {%- else -%}
      {%- set ns = namespace(match='zone.' ~ (to_state_val | lower | replace(' ', '_'))) -%}
      {%- for z in monitored_zones -%}
        {%- if z.split('.')[1] == to_state_val or (state_attr(z, 'friendly_name') | default('', true) | lower) == (to_state_val | lower) -%}
          {%- set ns.match = z -%}
        {%- endif -%}
      {%- endfor -%}
      {{- ns.match -}}
    {%- endif -%}

  from_zone_entity: >-
    {%- if from_state_val == 'home' -%}
      zone.home
    {%- elif from_state_val == 'not_home' -%}
      none
    {%- else -%}
      {%- set ns = namespace(match='zone.' ~ (from_state_val | lower | replace(' ', '_'))) -%}
      {%- for z in monitored_zones -%}
        {%- if z.split('.')[1] == from_state_val or (state_attr(z, 'friendly_name') | default('', true) | lower) == (from_state_val | lower) -%}
          {%- set ns.match = z -%}
        {%- endif -%}
      {%- endfor -%}
      {{- ns.match -}}
    {%- endif -%}

  current_event: >-
    {%- if not has_trigger -%}
      enter
    {%- elif to_state_val != 'not_home' and from_state_val == 'not_home' -%}
      {%- if monitored_zones == [] or to_zone_entity in monitored_zones -%}enter{%- else -%}ignore{%- endif -%}
    {%- elif to_state_val == 'not_home' and from_state_val != 'not_home' -%}
      {%- if monitored_zones == [] or from_zone_entity in monitored_zones -%}leave{%- else -%}ignore{%- endif -%}
    {%- elif to_state_val != 'not_home' and from_state_val != 'not_home' and to_state_val != from_state_val -%}
      {%- if monitored_zones == [] or to_zone_entity in monitored_zones or from_zone_entity in monitored_zones -%}cross_zone{%- else -%}ignore{%- endif -%}
    {%- else -%}
      ignore
    {%- endif -%}

  zone_name: >-
    {{ (state_attr(from_zone_entity, 'friendly_name') if has_value(from_zone_entity) else from_state_val | title) if current_event == 'leave' else (state_attr(to_zone_entity, 'friendly_name') if has_value(to_zone_entity) else to_state_val | title) }}

  final_message: >-
    {%- if current_event == 'enter' -%}
      {{ person }} has arrived at {{ zone_name }}.
    {%- elif current_event == 'leave' -%}
      {{ person }} has left {{ zone_name }}.
    {%- else -%}
      {%- set from_name = state_attr(from_zone_entity, 'friendly_name') if has_value(from_zone_entity) else from_state_val | title -%}
      {%- set to_name = state_attr(to_zone_entity, 'friendly_name') if has_value(to_zone_entity) else to_state_val | title -%}
      {{ person }} left {{ from_name }} and arrived at {{ to_name }}.
    {%- endif -%}

condition:
  - condition: template
    value_template: "{{ current_event != 'ignore' }}"

action:
  - choose:
      # ARRIVAL AND CROSSING EVENTS
      - conditions: >
          {{ (current_event == 'enter' and (chosen_event_type == 'enter' or chosen_event_type == 'both')) or
             (current_event == 'cross_zone' and chosen_event_type == 'both') }}
        sequence:
          - delay:
              seconds: "{{ delay_amount }}"
          - condition: template
            value_template: "{{ states(trigger_entity) == to_state_val if has_trigger else true }}"
          - repeat:
              for_each: "{{ target_devices }}"
              sequence:
                - variables:
                    device_name: "{{ device_attr(repeat.item, 'name_by_user') | default(device_attr(repeat.item, 'name'), true) | slugify }}"
                    is_ios: >-
                      {{ 'iphone' in (device_attr(repeat.item, 'name_by_user') | default(device_attr(repeat.item, 'name'), true) | lower)
                         or 'ipad' in (device_attr(repeat.item, 'name_by_user') | default(device_attr(repeat.item, 'name'), true) | lower) }}
                    notification_payload: >-
                      {%- set config = {
                        'ttl': 0,
                        'priority': 'high',
                        'channel': 'Zone Alerts',
                        'category': 'zone_alerts',
                        'tag': 'loc_' ~ as_timestamp(now()),
                        'group': 'family_tracking',
                        'thread-id': 'family_tracking'
                      } -%}
                      {%- set config = dict(config, push={'sound': {'name': 'default', 'critical': 1, 'volume': 1.0}}) if critical_override else config -%}
                      {%- if img_url != '' -%}
                        {%- set config = dict(config, attachment={'url': img_url}) if is_ios else dict(config, image=img_url) -%}
                      {%- endif -%}
                      {{ config }}
                - action: "notify.mobile_app_{{ device_name }}"
                  continue_on_error: true
                  data:
                    title: "{{ custom_title }}"
                    message: "{{ final_message }}"
                    data: "{{ notification_payload }}"

      # DEPARTURE EVENTS
      - conditions: "{{ current_event == 'leave' and (chosen_event_type == 'leave' or chosen_event_type == 'both') }}"
        sequence:
          - repeat:
              for_each: "{{ target_devices }}"
              sequence:
                - variables:
                    device_name: "{{ device_attr(repeat.item, 'name_by_user') | default(device_attr(repeat.item, 'name'), true) | slugify }}"
                    is_ios: >-
                      {{ 'iphone' in (device_attr(repeat.item, 'name_by_user') | default(device_attr(repeat.item, 'name'), true) | lower)
                         or 'ipad' in (device_attr(repeat.item, 'name_by_user') | default(device_attr(repeat.item, 'name'), true) | lower) }}
                    notification_payload: >-
                      {%- set config = {
                        'ttl': 0,
                        'priority': 'high',
                        'channel': 'Zone Alerts',
                        'category': 'zone_alerts',
                        'tag': 'loc_' ~ as_timestamp(now()),
                        'group': 'family_tracking',
                        'thread-id': 'family_tracking'
                      } -%}
                      {%- set config = dict(config, push={'sound': {'name': 'default', 'critical': 1, 'volume': 1.0}}) if critical_override else config -%}
                      {%- if img_url != '' -%}
                        {%- set config = dict(config, attachment={'url': img_url}) if is_ios else dict(config, image=img_url) -%}
                      {%- endif -%}
                      {{ config }}
                - action: "notify.mobile_app_{{ device_name }}"
                  continue_on_error: true
                  data:
                    title: "{{ custom_title }}"
                    message: "{{ final_message }}"
                    data: "{{ notification_payload }}"
